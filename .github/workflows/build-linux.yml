name: build-linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег существующего релиза (пусто — только тестовая сборка)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Ubuntu 24.04 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REL_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Сборка пакета
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build:linux

      - name: Проверка пакета и сетевых ядер
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-certifi python3-cryptography
          version=$(node -p 'require("./package.json").version')
          test -z "$REL_TAG" || test "${REL_TAG#v}" = "$version"
          test "$(dpkg-deb -f dist/LAZEYKA_amd64.deb Package)" = lazeyka
          test "$(dpkg-deb -f dist/LAZEYKA_amd64.deb Version)" = "$version"
          test "$(dpkg-deb -f dist/LAZEYKA_amd64.deb Architecture)" = amd64
          node scripts/smoke-native-runtime.mjs dist/linux-unpacked/resources
          cd dist
          sha256sum LAZEYKA_amd64.deb > LAZEYKA_amd64.deb.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: LAZEYKA-linux-x64-build${{ github.run_number }}
          path: |
            dist/LAZEYKA_amd64.deb
            dist/LAZEYKA_amd64.deb.sha256
          if-no-files-found: error

      - name: Добавление пакета в релиз
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # У готового пакета в описании релиза уже может быть указана своя SHA-256.
          existing=$(gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "LAZEYKA_amd64.deb" and .state == "uploaded") | .name')
          if [ -n "$existing" ]; then
            echo "Пакет Ubuntu уже загружен в релиз."
          else
            gh release upload "$REL_TAG" --repo "$GITHUB_REPOSITORY" \
              dist/LAZEYKA_amd64.deb dist/LAZEYKA_amd64.deb.sha256
          fi
