appId: com.lazeyka.app
productName: LAZEYKA
# Trim Chromium's locale pack from ~42 MB (55 files) to ~1.5 MB by shipping
# only the languages the LAZEYKA UI actually uses. The renderer is fully
# Russian; en-US stays as a fallback for system-level Chromium prompts
# (form validation, default context-menu strings) when ru is unavailable.
electronLanguages:
  - en-US
  - ru
directories:
  buildResources: build
files:
  # electron-builder добавляет production-зависимости отдельно. Ядра,
  # сетевые списки и плагин Stream Deck поставляются через extraResources.
  - 'out/**/*'
  - 'dns-presets.json'
  - 'package.json'
protocols:
  name: 'LAZEYKA URI Scheme'
  schemes:
    - 'lazeyka'
win:
  target:
    - nsis
    - 7z
  artifactName: ${productName}_${arch}-portable.${ext}
  requestedExecutionLevel: requireAdministrator
  # Windows: все рантайм-бинарники из resources/ (winws, sing-box.exe, tgws…).
  # Раньше блок стоял на верхнем уровне; electron-builder СКЛАДЫВАЕТ глобальные
  # extraResources с платформенными, поэтому для macOS (там нужен другой набор)
  # он перенесён сюда — итоговый конфиг Windows не изменился.
  extraResources:
    - from: './resources/'
      to: ''
      filter:
        - '**/*'
        - '!**/.git/**'
        - '!**/.github/**'
        - '!**/.service/**'
        - '!**/.gitignore'
        - '!**/.gitattributes'
        - '!**/README.md'
        - '!**/LICENSE.txt'
        - '!**/*.backup'
        - '!**/zapret/utils/**'
    # Плагин Stream Deck: папка .sdPlugin (и готовый .streamDeckPlugin, если его собрали
    # scripts/pack-streamdeck.mjs). Окно «Настройки → Stream Deck» ставит его из resources/streamdeck.
    - from: './streamdeck/'
      to: 'streamdeck'
      filter:
        - '**/*'
        - '!README.md'
nsis:
  artifactName: ${productName}_${arch}.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  include: build/nsis/installer.nsh
mac:
  # Целевая архитектура задаётся в CI ключом --arm64 / --x64 (universal не собираем).
  target:
    - dmg
    - zip
  artifactName: ${productName}_${arch}.${ext}
  category: public.app-category.utilities
  icon: build/icon.png
  minimumSystemVersion: '14.0'
  # Сертификата Apple Developer нет: подпись ad-hoc (identity '-'). Без неё
  # arm64-сборка не запустится вовсе. Hardened runtime и нотаризация без
  # платного сертификата невозможны, entitlements нужны только вместе с ними.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  # macOS не получает Windows-бинарники (153 МБ .exe/.dll и Python для tgws):
  # только списки, иконки трея, гео-базы INCY и ядра из resources-mac/
  # (их кладёт scripts/fetch-mac-binaries.mjs; раскладка та же: incy/sing-box, incy/xray).
  extraResources:
    - from: './resources/'
      to: ''
      filter:
        - 'lists/**/*'
        - 'icon.png'
        - 'icon_on.png'
        - 'icon_off.png'
        - 'incy/geoip.dat'
        - 'incy/geosite.dat'
    - from: './resources-mac/'
      to: ''
      filter:
        - '**/*'
    - from: './streamdeck/'
      to: 'streamdeck'
      filter:
        - '**/*'
        - '!README.md'
dmg:
  title: ${productName}
pkg:
  allowAnywhere: false
  allowCurrentUserHome: false
linux:
  target:
    - target: deb
      arch: x64
  executableName: lazeyka
  desktop:
    entry:
      MimeType: x-scheme-handler/lazeyka;
  maintainer: LAZEYKA
  category: Utility
  artifactName: ${productName}_${arch}.${ext}
  extraResources:
    - from: './resources/'
      to: ''
      filter:
        - 'icon*.png'
        - 'lists/**/*'
        - 'incy/geoip.dat'
        - 'incy/geosite.dat'
    - from: './resources-linux/'
      to: ''
      filter:
        - '**/*'
        - '!zapret-control'
        - '!incy-tun'
        - '!dns-control'
deb:
  fpm:
    - --deb-systemd
    - build/linux/lazeyka-zapret.service
    - --deb-systemd
    - build/linux/lazeyka-dns.service
    - --before-remove
    - build/linux/prerm
    - resources-linux/zapret-control=/usr/lib/lazeyka/zapret-control
    - resources-linux/incy-tun=/usr/lib/lazeyka/incy-tun
    - resources-linux/dns-control=/usr/lib/lazeyka/dns-control
    - build/linux/com.lazeyka.zapret.policy=/usr/share/polkit-1/actions/com.lazeyka.zapret.policy
    - build/linux/com.lazeyka.incy-tun.policy=/usr/share/polkit-1/actions/com.lazeyka.incy-tun.policy
    - build/linux/com.lazeyka.dns.policy=/usr/share/polkit-1/actions/com.lazeyka.dns.policy
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - python3
    - python3-certifi
    - python3-cryptography
    - systemd
    - nftables
    - iproute2
    - pkexec
    - libglib2.0-bin
    - gsettings-desktop-schemas
    - dconf-gsettings-backend
npmRebuild: true
publish: []
