<svg width="2560" height="1440" viewBox="0 0 2560 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="cyber_core_glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0c121e" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#080c14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="1"/>
    </radialGradient>

    <!-- Indigo Nebula Glow -->
    <radialGradient id="nebula_indigo" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Defense Glow -->
    <radialGradient id="nebula_emerald" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#059669" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Matrix Dot Grid Pattern -->
    <pattern id="cyber_grid_dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="#6366f1" fill-opacity="0.22"/>
      <path d="M 24 0 L 24 4 M 24 44 L 24 48 M 0 24 L 4 24 M 44 24 L 48 24" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.09"/>
    </pattern>

    <!-- Large HUD Blueprint Grid Pattern -->
    <pattern id="cyber_grid_lines" width="192" height="192" patternUnits="userSpaceOnUse">
      <rect width="192" height="192" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.06"/>
      <!-- Corner Markers -->
      <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
      <path d="M 192 16 L 192 0 L 176 0" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
      <path d="M 0 176 L 0 192 L 16 192" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
      <path d="M 192 176 L 192 192 L 176 192" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- 1. Deep Obsidian Base -->
  <rect width="2560" height="1440" fill="url(#cyber_core_glow)"/>

  <!-- 2. Ambient Color Nebulae -->
  <rect width="2560" height="1440" fill="url(#nebula_indigo)"/>
  <rect width="2560" height="1440" fill="url(#nebula_emerald)"/>

  <!-- 3. Grid Patterns -->
  <rect width="2560" height="1440" fill="url(#cyber_grid_dots)"/>
  <rect width="2560" height="1440" fill="url(#cyber_grid_lines)"/>

  <!-- 4. Subtle Cyber Constellation Nodes & Circuit Traces -->
  <g opacity="0.65">
    <!-- Orbital Target Rings -->
    <circle cx="680" cy="420" r="180" stroke="#6366f1" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="4 8"/>
    <circle cx="680" cy="420" r="240" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.10"/>
    <circle cx="1880" cy="420" r="180" stroke="#10b981" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="4 8"/>
    <circle cx="1880" cy="420" r="240" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.10"/>

    <!-- High-tech HUD Crosshairs -->
    <g stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.3">
      <path d="M 320 180 L 320 200 M 310 190 L 330 190"/>
      <path d="M 2240 180 L 2240 200 M 2230 190 L 2250 190"/>
      <path d="M 320 1260 L 320 1280 M 310 1270 L 330 1270"/>
      <path d="M 2240 1260 L 2240 1280 M 2230 1270 L 2250 1270"/>
      <path d="M 1280 80 L 1280 100 M 1270 90 L 1290 90"/>
    </g>

    <!-- Circuit Connection Traces -->
    <path d="M 320 190 L 540 190 L 680 330 L 680 420" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.22"/>
    <circle cx="540" cy="190" r="3.5" fill="#6366f1" fill-opacity="0.5"/>

    <path d="M 2240 190 L 2020 190 L 1880 330 L 1880 420" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.22"/>
    <circle cx="2020" cy="190" r="3.5" fill="#10b981" fill-opacity="0.5"/>

    <path d="M 680 510 L 680 640 L 960 920 L 1600 920 L 1880 640 L 1880 510" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.16" stroke-dasharray="6 6"/>

    <!-- Wave Horizon Lines at bottom -->
    <path d="M 0 1120 Q 640 1060 1280 1140 T 2560 1100" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.12"/>
    <path d="M 0 1180 Q 640 1120 1280 1200 T 2560 1160" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.10"/>
  </g>

  <!-- 5. Technical Cyber Typography Elements in Corners -->
  <g fill="#6366f1" fill-opacity="0.3" font-family="monospace" font-size="11" letter-spacing="2">
    <text x="340" y="194">SYS://CORE.MATRIX.ACTIVE</text>
    <text x="2040" y="194">SEC://TUNNEL.ENCRYPTED</text>
    <text x="340" y="1274">LOC://LATENCY.OPTIMIZED</text>
    <text x="2080" y="1274">VER://LAZEYKA.HUD.1.0.1</text>
  </g>
</svg>
